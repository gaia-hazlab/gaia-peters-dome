[project]
name = "peters-dome"
version = "0.1.0"
description = "Data container for the 2023 Peters Dome ice-rock avalanche (Denali, Alaska), staged with gaia-cli conventions"
requires-python = ">= 3.11"
dependencies = []

[project.scripts]
peters-dome = "peters_dome.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
cyclopts = ">=5.2,<6"
geopandas = ">=1.1,<2"
pyogrio = "*"
xarray = ">=2025.6"
zarr = ">=3"
xvec = ">=0.5.2,<0.6"
rioxarray = ">=0.22"
rasterio = "*"
dask = "*"
netcdf4 = "*"
h5netcdf = "*"
scipy = "*"
obspy = ">=1.4"
odc-stac = ">=0.5.2,<0.6"
pystac-client = ">=0.9"
planetary-computer = "*"
gcsfs = "*"
obstore = ">=0.9.2,<0.10"
boto3 = "*"
icechunk = ">=2.1"
pyyaml = "*"
requests = "*"
python-dotenv = "*"
matplotlib = "*"
pytest = ">=9.1.1,<10"   # pinned to match gaia-cli runtime deps
ruff = ">=0.17.0,<0.18"   # pinned to match gaia-cli runtime deps

[tool.pixi.pypi-dependencies]
# gaia-cli supplies the shared I/O (AOI loading, clipping, Zarr/xvec/DataTree writers)
# and the `gaia stage synoptic` command. Pinned to the commit this repo was written against.
gaia-cli = { git = "https://github.com/gaia-hazlab/gaia-cli.git", rev = "896b628" }
peters_dome = { path = ".", editable = true }

[tool.pixi.tasks]
stage-all = "bash scripts/stage_all.sh"
build-cube = "python scripts/build_datacube.py"
report = "python scripts/make_report.py"
check = "python scripts/check_store.py"
test = "pytest -q"
test-online = "pytest -q -m online"
lint = "ruff check src scripts tests"

[tool.hatch.build.targets.wheel]
packages = ["src/peters_dome"]

[tool.pytest.ini_options]
markers = ["online: hits remote data services"]
addopts = "-m 'not online'"
