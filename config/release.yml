# Hugging Face release of data/peters_dome.zarr. Read by scripts/hf_metadata.py and
# scripts/hf_publish.py. Every licence below was checked on 2026-10-30 against the source
# named in `checked`; edit this file, not the generated card.

hf_repo: gaia-hazlab/peters-dome
version: v1.0
collection_title: GAIA HazLab datasets
license: cc-by-4.0          # overall; per-group terms below take precedence
pretty_name: "Peters Dome 2023 ice-rock avalanche: multimodal event container"
keywords: [landslide, ice-rock avalanche, seismology, infrasound, SAR, DEM, glacier, Alaska, Denali, zarr]
creators:
  - {name: Marine Denolle, affiliation: University of Washington}
  # add Michael West (Alaska Earthquake Center) and Scott Henderson before minting a DOI

# Longest matching prefix wins. `attribution` is the text the source asks users to carry.
sources:
  stations/seismic:
    source: "FDSN waveforms via EarthScope DMC, networks AK, AV, AT (HH?/BH?, response removed)"
    license: "open (FDSN); cite network DOIs"
    attribution: "Alaska Earthquake Center, Univ. of Alaska Fairbanks (1987) Alaska Regional Network, doi:10.7914/SN/AK; Alaska Volcano Observatory/USGS (1988), doi:10.7914/SN/AV; NOAA National Tsunami Warning Center (1967), doi:10.7914/SN/AT"
    checked: "EarthScope fdsnws/station network DOIs and restrictedStatus, 2026-10-30"
  stations/seismic_lp:
    source: "FDSN BH? displacement via EarthScope DMC, networks AK, AV, AT, IU, IM"
    license: "open (FDSN); cite network DOIs"
    attribution: "as stations/seismic, plus GSN doi:10.7914/SN/IU and IMS doi:10.7914/vefq-vh75"
    checked: "EarthScope fdsnws/station, 2026-10-30"
  stations/seismic_continuous:
    source: "FDSN continuous BH? via EarthScope DMC, AK.KTH, AK.CAST, AK.PPLA (PR #4 precursor search)"
    license: "open (FDSN); cite network DOIs"
    attribution: "Alaska Earthquake Center, Univ. of Alaska Fairbanks (1987), doi:10.7914/SN/AK"
    checked: "EarthScope fdsnws/station, 2026-10-30"
  stations/infrasound:
    source: "FDSN BDF/HDF via EarthScope DMC, networks AK, AV, IM (IMS I53US elements I53H1-H8)"
    license: "open (FDSN); IM channels carry no restriction flag at EarthScope; IMS terms to be confirmed by M. West"
    attribution: "doi:10.7914/SN/AK; doi:10.7914/SN/AV; International Miscellaneous Stations, doi:10.7914/vefq-vh75"
    checked: "EarthScope fdsnws/station channel restrictedStatus for IM.I53H*, 2026-10-30"
  rasters/sar/sentinel1_rtc:
    source: "Sentinel-1 RTC, Microsoft Planetary Computer collection sentinel-1-rtc"
    license: CC-BY-4.0
    attribution: "Contains modified Copernicus Sentinel data 2023, processed by Catalyst/Microsoft Planetary Computer"
    checked: "Planetary Computer STAC collection license field"
  rasters/optical/sentinel2:
    source: "Sentinel-2 L2A Collection 1, Earth Search (Element 84)"
    license: "Copernicus Sentinel data terms (free, full and open)"
    attribution: "Contains modified Copernicus Sentinel data 2023"
    checked: "Earth Search STAC collection license link (Sentinel Data Legal Notice)"
  rasters/optical/landsat:
    source: "Landsat 8/9 Collection 2 Level-2, Microsoft Planetary Computer"
