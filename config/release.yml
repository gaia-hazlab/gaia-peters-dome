    checked: "USGS release"
  model/shaltop:
    source: "Published SHALTOP run 0520, USGS data release doi:10.5066/P13WIS6X, staged unmodified"
    license: "US public domain (USGS)"
    attribution: "Toney et al. (2026) USGS data release, doi:10.5066/P13WIS6X"
    checked: "USGS release"
  vectors/landslide_outlines:
    source: "Source and deposit outlines, USGS data release doi:10.5066/P13WIS6X"
    license: "US public domain (USGS)"
    attribution: "Toney et al. (2026) USGS data release, doi:10.5066/P13WIS6X"
    checked: "USGS release"
  vectors/glacier/rgi:
    source: "Randolph Glacier Inventory, layer GLIMS:RGI_Alaska of the GLIMS WFS (RGI version not recorded at staging)"
    license: CC-BY-4.0
    attribution: "RGI Consortium, Randolph Glacier Inventory, Alaska region, as served by GLIMS"
    checked: "RGI user guide (licence); version to confirm from the GLIMS layer metadata"
  vectors/glacier/glims:
    source: "GLIMS Glacier Database via WFS"
