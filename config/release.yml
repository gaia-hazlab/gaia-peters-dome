    checked: "Planetary Computer STAC collection license link (USGS data policy)"
  rasters/topography/copdem:
    source: "Copernicus DEM GLO-30"
    license: "Copernicus DEM GLO-30 licence (free; redistribution allowed; pass the licence on)"
    attribution: "produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
    license_url: "https://documentation.dataspace.copernicus.eu/APIs/SentinelHub/Data/DEM/resources/license/License-COPDEM-30.pdf"
    checked: "licence PDF via web search"
  rasters/topography/arcticdem:
    source: "ArcticDEM v4.1 (PGC): mosaic and s2s041 strips, read at 10 m from COG overviews"
    license: CC-BY-4.0
    attribution: "DEM(s) created by the Polar Geospatial Center from Maxar, Inc. imagery; NSF-OPP awards 1043681, 1559691, 1542736, 1810976, 2129685"
