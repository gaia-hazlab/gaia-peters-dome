    checked: "USGS publication; US Government work"
  datacube:
    source: "Derived in this repository (scripts/build_datacube.py) from the groups above"
    license: "CC-BY-4.0 for the derivation; inputs keep their own terms above"
    attribution: "see the input groups"
    checked: "n/a"
